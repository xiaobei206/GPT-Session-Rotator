name: Windows CI and Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish a GitHub Release after the Windows build succeeds
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-and-build:
    name: Test and build Windows installer
    runs-on: windows-latest
    timeout-minutes: 35
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate version metadata
        id: version
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          $package = Get-Content package.json -Raw | ConvertFrom-Json
          if ($version -ne $package.version) {
            throw "VERSION ($version) does not match package.json ($($package.version))."
          }
          if ($version -notmatch '^[0-9]+[.][0-9]+[.][0-9]+$') {
            throw "Invalid SemVer version: $version"
          }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Verify source manifest
        shell: pwsh
        run: |
          $count = 0
          foreach ($line in Get-Content SOURCE-MANIFEST.sha256) {
            if ($line.Length -lt 68) { throw "Invalid manifest line: $line" }
            $expected = $line.Substring(0, 64)
            if ($expected -notmatch '^[0-9a-f]{64}$' -or $line.Substring(64, 2) -ne '  ') {
              throw "Invalid manifest line: $line"
            }
            $relative = $line.Substring(66).Trim().Replace('/', [IO.Path]::DirectorySeparatorChar)
            if (!(Test-Path -LiteralPath $relative -PathType Leaf)) {
              throw "Manifest file missing: $relative"
            }
            $actual = (Get-FileHash -LiteralPath $relative -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($actual -ne $expected) {
              throw "SHA-256 mismatch: $relative (expected $expected, got $actual)"
            }
            $count++
          }
          if ($count -lt 1) { throw 'Source manifest is empty.' }
          Write-Host "Verified $count source files against SOURCE-MANIFEST.sha256."

      - name: Install dependencies (retry transient Electron download failures)
        shell: pwsh
        run: |
          $maxAttempts = 4
          for ($attempt = 1; $attempt -le $maxAttempts; $attempt++) {
            Write-Host "Installing dependencies (attempt $attempt/$maxAttempts)"
            npm install --no-audit --no-fund
            $installExitCode = $LASTEXITCODE
            if ($installExitCode -eq 0) {
              Write-Host "Dependencies installed successfully."
              break
            }
            if ($attempt -eq $maxAttempts) {
              throw "npm install failed after $maxAttempts attempts (exit code $installExitCode)."
            }
            $delaySeconds = [Math]::Min(60, [int](10 * [Math]::Pow(2, $attempt - 1)))
            Write-Warning "Dependency installation failed (exit $installExitCode); retrying in $delaySeconds seconds."
            Start-Sleep -Seconds $delaySeconds
          }

      - name: Run unit tests
        run: npm test

      - name: Check JavaScript syntax
        shell: pwsh
        run: |
          $files = Get-ChildItem src, tests -Recurse -File | Where-Object { $_.Extension -in '.js', '.cjs' }
          if ($files.Count -lt 1) { throw 'No JavaScript/CJS files found.' }
          foreach ($file in $files) {
            node --check $file.FullName
            if ($LASTEXITCODE -ne 0) { throw "Syntax check failed: $($file.FullName)" }
          }
          Write-Host "node --check passed for $($files.Count) files."

      - name: Build Windows x64 NSIS installer
        run: npm run dist:win

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: windows-nsis-installer
          path: |
            dist/*-Setup.exe
            dist/*.blockmap
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub Release
    needs: verify-and-build
    if: >-
      (github.event_name == 'push' && contains(github.event.head_commit.message, '[release]')) ||
      (github.event_name == 'workflow_dispatch' && inputs.publish_release == true)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out release metadata
        uses: actions/checkout@v4

      - name: Download Windows installer
        uses: actions/download-artifact@v4
        with:
          name: windows-nsis-installer
          path: release-assets

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.verify-and-build.outputs.version }}
          name: GPT Session Rotator v${{ needs.verify-and-build.outputs.version }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: release-assets/*
          fail_on_unmatched_files: true
          draft: false
          prerelease: false
